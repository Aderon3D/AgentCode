name: AI AutoFix

on:
  issue_comment:
    types: [created]

concurrency:
  group: autofix-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/autofix')
    steps:
      - name: Validate commenter permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          # Only collaborators with write access can trigger autofix
          PERM_ERR=$(mktemp)
          PERM=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq '.permission' 2>"$PERM_ERR") || {
            cat "$PERM_ERR" >&2
            rm -f "$PERM_ERR"
            gh pr comment "$PR_NUMBER" --body "Failed to verify permissions. Please try again."
            exit 1
          }
          rm -f "$PERM_ERR"
          if [ "$PERM" != "write" ] && [ "$PERM" != "admin" ]; then
            gh pr comment "$PR_NUMBER" --body "@$COMMENTER: only repository collaborators with write access can use /autofix."
            exit 1
          fi

      - name: Check for /stop
        if: startsWith(github.event.comment.body, '/stop')
        run: |
          echo "Stop requested - cancelling autofix"
          exit 0

      - name: Initialize
        id: init
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # Get PR branch
          PR_JSON=$(gh pr view "$PR_NUMBER" --json headRefName,headRepositoryOwner)
          HEAD_REF=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['headRefName'])")
          HEAD_OWNER=$(echo "$PR_JSON" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('headRepositoryOwner',{}).get('login','unknown'))")

          # Block fork PRs
          if [ "$HEAD_OWNER" != "${{ github.repository_owner }}" ]; then
            gh pr comment "$PR_NUMBER" --body "Cannot run autofix on fork PRs."
            exit 1
          fi

          ENV_DELIM=$(uuidgen)
          {
            echo "HEAD_REF<<$ENV_DELIM"
            echo "$HEAD_REF"
            echo "$ENV_DELIM"
          } >> "$GITHUB_ENV"

          # Post initial comment
          gh pr comment "$PR_NUMBER" --body "🤖 **AutoFix started** — I'll iterate fix → review until no Major issues remain.

          Max rounds: 5. Use \`/stop\` to cancel."

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.local/share/opencode/bin" >> "$GITHUB_PATH"

      - name: Autofix loop
        id: loop
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MAX_ROUNDS=5
          ROUND=0

          while [ "$ROUND" -lt "$MAX_ROUNDS" ]; do
            ROUND=$((ROUND + 1))
            echo "=== Round $ROUND ==="

            # Check for /stop comment
            LATEST_COMMENT=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[-1].body' 2>/dev/null || echo "")
            if echo "$LATEST_COMMENT" | grep -q '^/stop'; then
              echo "Stop requested at round $ROUND"
              gh pr comment "$PR_NUMBER" --body "🛑 AutoFix stopped at round $ROUND."
              break
            fi

            # Find latest AI review
            REVIEW_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq '[.[] | select(.body | startswith("# AI Code Review"))] | last | .id' 2>/dev/null || echo "")

            if [ -z "$REVIEW_ID" ]; then
              echo "No AI review found, triggering review first"
              gh workflow run ai-review.yml --ref "$HEAD_REF"
              echo "Waiting for review to complete..."
              sleep 60
              continue
            fi

            # Fetch review body
            gh api "repos/$REPO/issues/comments/$REVIEW_ID" --jq '.body' > /tmp/review.md

            # Check for Major findings
            MAJOR_COUNT=$(grep -ciE '\*{0,2}severity:\*{0,2}\s*major' /tmp/review.md || echo "0")
            echo "Major findings: $MAJOR_COUNT"

            if [ "$MAJOR_COUNT" -eq 0 ]; then
              echo "No Major findings - done!"
              gh pr comment "$PR_NUMBER" --body "✅ **AutoFix complete** — no Major findings after $ROUND round(s)."
              break
            fi

            # Apply fixes
            echo "Applying fixes..."

            # Parse fixes (reuse ai-fix logic)
            python3 << 'PYEOF'
          import re, json

          with open('/tmp/review.md') as f:
              content = f.read()

          fixed_markers = set(re.findall(r'<!--\s*fixed:([^:]+:.+?)\s*-->', content))
          fixes = []
          sections = re.split(r'(?=^## )', content, flags=re.MULTILINE)

          for section in sections:
              if not section.strip() or 'No issues found' in section:
                  continue

              before_match = re.search(r'```(?:bash|sh|yaml|yml|json|typescript|javascript|python|java)?\s*\n# Before.*?\n(.*?)(?=\n# After|\n```\s*$)', section, re.DOTALL)
              after_match = re.search(r'```(?:bash|sh|yaml|yml|json|typescript|javascript|python|java)?\s*\n# After.*?\n(.*?)```', section, re.DOTALL)
              file_match = re.search(r'\*\*(?:file|File):\*\*\s*`?([^`\n]+)`?', section)
              file_path = file_match.group(1).strip() if file_match else None

              if file_path:
                  file_path = re.sub(r':\d+$', '', file_path).strip()

              if before_match and after_match and file_path:
                  before = before_match.group(1).strip()
                  after = after_match.group(1).strip()
                  marker = f"{file_path}:{before[:40]}"
                  if marker not in fixed_markers and before:
                      fixes.append({
                          'file': file_path,
                          'before': before,
                          'after': after,
                      })

          with open('/tmp/fixes.json', 'w') as f:
              json.dump(fixes, f, indent=2)

          print(f"Found {len(fixes)} parseable fixes")
          PYEOF

            FIX_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/fixes.json'))))")

            if [ "$FIX_COUNT" -eq 0 ]; then
              echo "No parseable fixes found"
              gh pr comment "$PR_NUMBER" --body "⚠️ **AutoFix round $ROUND** — found $MAJOR_COUNT Major issues but no parseable Before/After fixes."
              break
            fi

            # Apply each fix
            APPLIED=0
            REPO_ROOT=$(pwd)

            for i in $(seq 0 $((FIX_COUNT - 1))); do
              FILE=$(python3 -c "import json; f=json.load(open('/tmp/fixes.json')); print(f[$i]['file'])")
              BEFORE=$(python3 -c "import json; f=json.load(open('/tmp/fixes.json')); v=f[$i]['before']; print(v if v is not None else '')")
              AFTER=$(python3 -c "import json; f=json.load(open('/tmp/fixes.json')); print(f[$i]['after'])")

              if [ -z "$BEFORE" ] || [ ! -f "$FILE" ]; then
                continue
              fi

              RESOLVED=$(realpath "$FILE" 2>/dev/null || echo "")
              if [ -z "$RESOLVED" ] || [[ "$RESOLVED" != "$REPO_ROOT"/* ]]; then
                continue
              fi

              BEFORE_TMP=$(mktemp /tmp/before-XXXXXX)
              AFTER_TMP=$(mktemp /tmp/after-XXXXXX)
              printf '%s' "$BEFORE" > "$BEFORE_TMP"
              printf '%s' "$AFTER" > "$AFTER_TMP"

              TARGET_FILE="$FILE" BEFORE_FILE="$BEFORE_TMP" AFTER_FILE="$AFTER_TMP" python3 -c "
          import sys, os
          target = os.environ['TARGET_FILE']
          with open(os.environ['BEFORE_FILE']) as f: before = f.read()
          with open(os.environ['AFTER_FILE']) as f: after = f.read()
          with open(target) as f: content = f.read()
          if before not in content:
              print(f'Before text not found in {target}', file=sys.stderr)
              sys.exit(1)
          content = content.replace(before, after, 1)
          with open(target, 'w') as f: f.write(content)
          " && APPLIED=$((APPLIED + 1)) || true

              rm -f "$BEFORE_TMP" "$AFTER_TMP"
            done

            if [ "$APPLIED" -eq 0 ]; then
              echo "No fixes applied"
              gh pr comment "$PR_NUMBER" --body "⚠️ **AutoFix round $ROUND** — found $MAJOR_COUNT Major issues but could not apply any fixes."
              break
            fi

            # Commit and push
            git config user.name "ai-review[bot]"
            git config user.email "ai-review[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: autofix round $ROUND — apply AI review suggestions"
            git push

            gh pr comment "$PR_NUMBER" --body "🔄 **AutoFix round $ROUND** — applied $APPLIED fix(es). Waiting for review..."

            # Wait for review to complete
            echo "Waiting for review..."
            sleep 90

          done

          if [ "$ROUND" -ge "$MAX_ROUNDS" ]; then
            gh pr comment "$PR_NUMBER" --body "⏹️ **AutoFix** — reached max rounds ($MAX_ROUNDS). Remaining issues tracked in issues."
          fi

          rm -f /tmp/review.md /tmp/fixes.json
