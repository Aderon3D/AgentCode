# Build verification — required PR gate for Aderon3D.
#
# Every PR targeting `main` MUST compile the shared module and the Android app
# and pass the M0.5 host tests (`./gradlew :shared:testAndroidHostTest`).
# This is the primary guard against AI-generated code that does not even compile
# or breaks the deterministic M0.5 spine.
name: "Build & Test"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build, compile & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Compile shared (Kotlin/Android)
        run: ./gradlew :shared:compileAndroidMain --no-daemon

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Run M0.5 host tests
        run: ./gradlew :shared:testAndroidHostTest --no-daemon
