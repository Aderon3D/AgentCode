# Build verification — required PR gate for Aderon3D.
#
# Every PR targeting `main` MUST compile the KMP library modules (agent-core,
# provider-subsystem, workspace-engine, app-ui) and the Android app, pass every
# module's host tests, and run detekt. This is the primary guard against
# AI-generated code that does not compile or silently breaks a module's tests.
name: "Build & Test"

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build, compile & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Compile KMP library modules (Kotlin/Android)
        run: ./gradlew :agent-core:compileAndroidMain :provider-subsystem:compileAndroidMain :workspace-engine:compileAndroidMain :app-ui:compileAndroidMain --no-daemon

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Run host tests (all modules)
        run: >-
          ./gradlew
          :agent-core:testAndroidHostTest
          :provider-subsystem:testAndroidHostTest
          :workspace-engine:testAndroidHostTest
          :app-ui:testAndroidHostTest
          --no-daemon

      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-daemon
