# CodeQL Advanced — Aderon3D (AgentCode, Kotlin Multiplatform)
#
# Runs on every PR to main and on every push to main, plus a weekly scheduled
# scan. Two languages:
#   - `actions`      : CI workflow files (reliable, no build needed)
#   - `java-kotlin`  : Kotlin source scanning via an explicit single-target
#                      Gradle build. The Kotlin extractor hooks in as a Kotlin
#                      compiler plugin during compilation, so we point it at the
#                      `compileKotlinMetadata` task (runs for every module that
#                      has it — agent-core, provider-subsystem, workspace-engine,
#                      app-ui — covering all of `commonMain`) instead of letting
#                      the autobuilder pick a target — the autobuilder fails on
#                      KMP's multi-target variant graph (`AmbiguousArtifactsFailure`).
#                      `build-mode: none` is not viable either, because CodeQL
#                      silently skips Kotlin unless a build is run.
name: "CodeQL Advanced"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '37 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Kotlin (single target) for CodeQL tracing
        if: matrix.build-mode == 'manual'
        run: ./gradlew compileKotlinMetadata --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
