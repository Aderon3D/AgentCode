# Dependency review bot — blocks PRs that introduce known-vulnerable
# dependencies or license violations. Runs only on PRs (the "bot" that
# comments on dependency changes before merge).
name: "Dependency Review"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          warn-on-openssf-scorecard-severity: high
