# Dependency review bot — blocks PRs that introduce known-vulnerable
# dependencies or license violations. Runs only on PRs (the "bot" that
# comments on dependency changes before merge).
name: "Dependency Review"

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          base-ref: ${{ github.event.pull_request.base.ref || 'main' }}
          head-ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
