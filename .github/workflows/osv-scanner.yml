# OSV Scanner — vulnerability scanning of dependencies on every PR.
# Complements the dependency-review bot with the full OSV.dev advisory database.
name: "OSV Scanner"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  schedule:
    - cron: '52 4 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSV Scanner
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --format=sarif
            --output=osv.sarif
            --recursive
            ./
        continue-on-error: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif
          category: "osv-scanner"
