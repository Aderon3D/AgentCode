# OSV Scanner — vulnerability scanning of dependencies on every PR.
# Uses the official osv-scanner reusable workflow, which produces and uploads
# the SARIF result itself (the standalone `osv-scanner-action` Docker action is
# not intended for direct use and does not emit the SARIF file reliably).
name: "OSV Scanner"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  schedule:
    - cron: '52 4 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: OSV dependency scan
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      # Report findings to Security > Code Scanning without blocking the PR on
      # pre-existing vulnerabilities in the skeleton's Gradle/AGP toolchain.
      fail-on-vuln: false
