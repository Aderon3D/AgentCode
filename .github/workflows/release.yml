# Publishes the debug APK to GitHub Releases on every push to main.
#
# The in-app updater (androidApp/.../update/Updater.kt) polls
# `releases?per_page=10`, picks the newest `r<NN>` tag and installs it, so a
# release here is what "next version" means on the device. The tag comes from
# OpenCodeClient.APP_BUILD, which also drives versionCode/versionName, and the
# APK is signed with the same key local builds use (secrets) so it updates the
# installed app instead of colliding with it.
name: "Release APK"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # `secrets` is not available in a step `if:` (the workflow fails to parse),
    # so the secret is exposed once here and steps read the env var.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Require signing secrets
        run: |
          # Before the build: without the key Gradle is handed a nonexistent
          # keystore and fails opaquely. Fail with the real reason instead.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; the APK would not be signed with the key the installed app trusts."
            exit 1
          fi

      - name: Decode signing key
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.jks"

      - name: Assemble Android debug APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/app.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Verify the APK carries the updater's signing key
        run: |
          APK=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          EXPECTED=b0ed277135998b84203ea4cfda7ef55d516fa775caa311caf63afb9a1c954268
          if [ "$DIGEST" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $DIGEST, not the updater key ($EXPECTED); devices would reject the update."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(grep -oE 'APP_BUILD = "r[0-9]+"' \
            provider-subsystem/src/commonMain/kotlin/com/agent/code/opencode/OpenCodeClient.kt \
            | grep -oE 'r[0-9]+')
          APK="AgentCode-$TAG.apk"
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Keep exactly one APK asset: the updater takes the first ".apk" it
            # finds, and a manual publish under another name would linger.
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              | grep -E '\.apk$' \
              | while read -r name; do
                  [ "$name" = "$APK" ] || gh release delete-asset "$TAG" "$name" -y
                done
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TAG" \
              --notes "Automatic build of ${GITHUB_SHA:0:7} — installed by the in-app updater."
          fi
